    Analyze this agent's performance and provide coaching recommendations.

    Your analysis must return a JSON object with this EXACT structure:
    {{
      "summary": {{
        "overall_score": <1-10 score>,
        "cases_analyzed": <number>,
        "period": "<date range>",
        "headline": "<1 sentence performance summary>"
      }},

      "metrics": {{
        "total_cases": <number>,
        "open_cases": <number>,
        "closed_cases": <number>,
        "avg_resolution_days": <number or null if insufficient data>,
        "by_priority": {{
          "high": <count>,
          "medium": <count>,
          "low": <count>
        }},
        "by_status": {{
          "<status>": <count>
        }}
      }},

      "comparison_to_team": {{
        "case_volume": "<above/at/below average with context>",
        "resolution_speed": "<above/at/below average with context>",
        "case_complexity": "<assessment of complexity mix>"
      }},

      "strengths": [
        {{
          "area": "<strength area>",
          "evidence": "<specific examples from cases>",
          "impact": "<why this matters>"
        }}
      ],

      "improvement_areas": [
        {{
          "area": "<area needing improvement>",
          "current_state": "<what's happening now>",
          "target_state": "<what good looks like>",
