# CrewAI Task Definitions
# Edit these to customize what each crew analyzes and outputs

# =============================================================================
# SALES PIPELINE TASKS
# =============================================================================

analyze_pipeline:
  description: >
    Analyze the following sales pipeline data for {user_name}:

    OPPORTUNITIES:
    {opportunities_data}

    PIPELINE SUMMARY:
    - Total Pipeline Value: ${total_amount}
    - Number of Open Opportunities: {opp_count}
    - Average Probability: {avg_probability}%

    Provide a comprehensive analysis including:
    1. Overall pipeline health assessment
    2. Top opportunities by value and their status
    3. Deals at risk (past close date, low probability, stalled)
    4. Opportunities needing immediate attention
    5. Pipeline coverage vs. quota (if available)
  expected_output: >
    A structured analysis with:
    - Executive summary (2-3 sentences)
    - Risk assessment with specific deals flagged
    - Priority action items ranked by impact
    - 30/60/90 day pipeline outlook
  agent: sales_pipeline_analyst

develop_deal_strategies:
  description: >
    Based on the pipeline analysis, develop specific strategies for the top
    opportunities and at-risk deals identified.

    For each key deal, provide:
    1. Recommended next steps
    2. Stakeholder engagement strategy
    3. Potential objection handling
    4. Competitive positioning (if relevant)
    5. Timeline recommendations
  expected_output: >
    Deal-by-deal strategic recommendations that are specific, actionable,
    and include clear next steps with suggested timelines.
  agent: sales_strategist
  context:
    - analyze_pipeline

# =============================================================================
# ACCOUNT HEALTH TASKS
# =============================================================================

assess_account_health:
  description: >
    Analyze the following account data:

    ACCOUNT: {account_name}
    TIER: {account_tier}
    ARR: ${arr}

    RECENT ACTIVITY:
    {activity_data}

    SUPPORT TICKETS:
    {support_data}

    ENGAGEMENT METRICS:
    {engagement_data}

    Assess:
    1. Overall health score (1-100)
    2. Churn risk indicators
    3. Expansion opportunities
    4. Key stakeholder engagement levels
    5. Product adoption status
  expected_output: >
    A health assessment including:
    - Health score with rationale
    - Red/yellow/green status indicators
    - Risk factors with severity ratings
    - Expansion opportunities with estimated value
    - Recommended actions prioritized by impact
  agent: account_health_analyst

# =============================================================================
# IMPLEMENTATION TASKS
# =============================================================================

analyze_implementation:
  description: >
    Analyze the following implementation project:

    PROJECT: {project_name}
    ACCOUNT: {account_name}
    STATUS: {project_status}

    TIMELINE:
    - Start Date: {start_date}
    - Target Go-Live: {target_go_live}
    - Current Phase: {current_phase}

    PROGRESS:
    - Completion: {completion_pct}%
    - Hours Used: {hours_used} / {hours_budgeted}
    - Budget Used: ${budget_used} / ${budget_total}

    MILESTONES:
    {milestones_data}

    BLOCKERS/RISKS:
    {risks_data}

    CALL ACTIVITY (Customer Engagement):
    {call_activity}

    MAVENLINK TASKS (Project Work Breakdown):
    {mavenlink_tasks}

    CRITICAL: Pay close attention to task dates and assignees. Flag these as risks:
    - Overdue tasks (past due date but not completed)
    - Tasks without assignees, especially client-facing tasks
    - Tasks without due dates (lack of planning)
    - Bunching of due dates that may indicate unrealistic scheduling

    Provide:
    1. Project health assessment (consider task completion and overdue items)
    2. Risk analysis with mitigation strategies (include task-related risks)
    3. Timeline feasibility (analyze task due dates vs target go-live)
    4. Resource utilization analysis (look at task assignments)
    5. Customer engagement analysis (based on call frequency and upcoming meetings)
    6. Task planning assessment (are tasks properly assigned and scheduled?)
    7. Recommendations for staying on track
  expected_output: >
    A project health report including:
    - Overall status (On Track / At Risk / Critical)
    - Key risks ranked by severity and likelihood (including task-related risks like overdue items, unassigned tasks)
    - Customer engagement assessment (are we meeting often enough? gaps in communication?)
    - Task planning assessment (are tasks properly assigned? are due dates realistic?)
    - Specific recommendations with owners and deadlines
    - Revised timeline if needed
    - Escalation recommendations if applicable
  agent: implementation_analyst

# =============================================================================
# SENTIMENT ANALYSIS TASKS
# =============================================================================

analyze_sentiment:
  description: >
    Analyze customer sentiment for:

    ACCOUNT: {account_name}

    RECENT COMMUNICATIONS:
    {communications_data}

    SUPPORT INTERACTIONS:
    {support_data}

    MEETING NOTES:
    {meeting_notes}

    Provide:
    1. Overall sentiment score (-100 to +100)
    2. Sentiment trend (improving/stable/declining)
    3. Key themes and concerns identified
    4. Positive signals
    5. Warning signs requiring attention
  expected_output: >
    A sentiment analysis including:
    - Sentiment score with confidence level
    - Trend analysis over time
    - Specific quotes/examples supporting the assessment
    - Recommended talking points for next interaction
    - Suggested actions to improve sentiment
  agent: sentiment_analyst

# =============================================================================
# COMPETITIVE ANALYSIS TASKS
# =============================================================================

analyze_competitive_landscape:
  description: >
    Analyze the competitive situation for:

    OPPORTUNITY: {opportunity_name}
    ACCOUNT: {account_name}
    STAGE: {stage}

    KNOWN COMPETITORS:
    {competitors_data}

    DEAL CONTEXT:
    {deal_context}

    Provide:
    1. Competitive threat assessment
    2. Our strengths vs. each competitor
    3. Our vulnerabilities to address
    4. Recommended positioning strategy
    5. Objection handling for each competitor
  expected_output: >
    A competitive battle plan including:
    - Threat level for each competitor (High/Medium/Low)
    - Key differentiators to emphasize
    - Landmines to avoid
    - Talk tracks for competitive discussions
    - Win themes to reinforce throughout the sales cycle
  agent: competitive_analyst

# =============================================================================
# PROJECT SENTIMENT TASKS
# =============================================================================

analyze_project_sentiment:
  description: >
    Analyze the following implementation project meeting transcripts:

    PROJECT: {project_name}
    ACCOUNT: {account_name}

    MEETING TRANSCRIPTS:
    {transcripts_data}

    You must analyze and return a JSON object with the following structure:
    {{
      "score": <1-10 overall project sentiment/health>,
      "pm_effectiveness_score": <1-10>,
      "summary": "<6-10 sentences executive summary>",
      "pm_summary": "<10-16 sentences including: (a) PM strengths, (b) PM improvement areas, (c) 6-10 coaching recommendations as directives, (d) 2-4 example phrases PM could use. Use markdown: - for bullets, **bold** for emphasis>",
      "customer_sentiment_summary": "<6-10 sentences about customer tone and engagement>",
      "timeline_deliverables_summary": "<6-12 sentences about timelines and deliverables>",
      "risks_summary": "<6-10 sentences about risks and concerns>",
      "deliverables": [
        {{"deliverable": "", "owner": "", "due_date": "", "status": "committed|tentative|unclear", "evidence": "<quote>", "call": "<meeting_subject>", "call_date": ""}}
      ],
      "timeline_dates": [
        {{"date": "", "context": "", "call": "", "call_date": ""}}
      ],
      "participants_sentiment": {{
        "customer": ["collaborative", "anxious"],
        "pm": ["clear", "directive"],
        "notes": "<2-4 coaching notes about interaction dynamics>"
      }},
      "key_quotes": [
        {{"speaker": "", "quote": "", "sentiment": "positive|negative|neutral", "call": "", "call_date": ""}}
      ]
    }}

    KEY QUOTES INSTRUCTIONS:
    Select 3-6 quotes that DIRECTLY express sentiment about the project, relationship, or experience.
    Each quote MUST clearly convey emotion or opinion - NOT factual statements or questions.

    GOOD examples (include these types):
    - "We're really excited about this rollout" (positive)
    - "I'm frustrated we keep pushing this back" (negative)
    - "The team has been great to work with" (positive)
    - "I'm concerned about hitting the deadline" (negative)
    - "This is exactly what we needed" (positive)

    BAD examples (do NOT include these types):
    - "Let's schedule a follow-up for next week" (neutral/logistical)
    - "Can you send me the documentation?" (question, not sentiment)
    - "The integration uses REST APIs" (factual, no sentiment)

    SCORING RUBRIC:
    - 9-10: Clear plan, owners, dates; customer aligned/positive; risks managed
    - 7-8: Mostly strong; minor gaps but good momentum
    - 5-6: Mixed; recurring ambiguity, weak follow-up, customer hesitation
    - 3-4: Significant risk; unclear ownership; customer frustration
    - 1-2: Derailing; high conflict; no credible plan

    Apply RECENCY WEIGHTING: most recent calls (last 30 days) are PRIMARY indicators.
  expected_output: >
    A valid JSON object matching the structure above. The JSON must be parseable.
    Use markdown formatting in string values (- for bullets, **bold** for emphasis).
    All arrays should have at least one item if data exists.
  agent: implementation_coach

# =============================================================================
# OPPORTUNITY STRATEGY TASKS (McKinsey-style Deal Analysis)
# =============================================================================

analyze_opportunity_strategy:
  description: >
    Perform a comprehensive McKinsey-style analysis of this enterprise opportunity:

    OPPORTUNITY: {opportunity_name}
    ACCOUNT: {account_name}
    AMOUNT: ${amount}
    STAGE: {stage_name}
    PROBABILITY: {probability}%
    CLOSE DATE: {close_date}
    OWNER: {owner_name}

    OPPORTUNITY DETAILS:
    {opportunity_details}

    ACCOUNT CONTEXT:
    {account_context}

    RECENT MEETING NOTES/TRANSCRIPTS:
    {meeting_data}

    SUPPORT CASES (if any):
    {support_data}

    Analyze this opportunity as if you were a McKinsey consultant advising on a
    multi-million dollar deal. Be rigorous, evidence-based, and brutally honest.

    CRITICAL: Distinguish between CUSTOMER stakeholders and LeanData INTERNAL employees:
    - LeanData employees (AEs, CSMs, SEs, PMs) are OUR team, NOT customer stakeholders
    - Names with @leandata.com emails or LeanData titles are INTERNAL
    - Only list CUSTOMER contacts as stakeholders (economic buyer, champion, blockers, influencers)
    - If you see a LeanData employee in transcripts, they are the internal team working the deal
    - Common LeanData roles: Account Executive, CSM, Customer Success Manager, Solutions Engineer,
      Implementation Manager, Support Engineer, Sales Rep

    Return a JSON object with the following structure:
    {{
      "score": <1-10 overall deal health/win probability>,
      "win_probability_assessment": "<frank assessment: Likely Win | Competitive | Uphill Battle | Long Shot>",
      "executive_summary": "<4-6 sentences: the bottom line on this deal>",

      "qualification": {{
        "score": <1-10>,
        "has_budget": <true|false|"unclear">,
        "has_authority": <true|false|"unclear">,
        "has_need": <true|false|"unclear">,
        "has_timeline": <true|false|"unclear">,
        "champion_strength": "<strong|moderate|weak|none>",
        "decision_process_clarity": "<clear|partially clear|unclear>",
        "assessment": "<3-5 sentences on qualification status>"
      }},

      "stakeholders": {{
        "economic_buyer": "<name/role or 'Unknown'>",
        "champion": "<name/role or 'None identified'>",
        "blockers": ["<name/role if any>"],
        "key_influencers": ["<name/role>"],
        "power_map_summary": "<4-6 sentences on org dynamics and politics>",
        "relationship_gaps": ["<gaps to address>"]
      }},

      "value_proposition": {{
        "quantified_pain": "<what problem, quantified if possible>",
        "proposed_value": "<our value proposition>",
        "roi_potential": "<estimated ROI or 'Not yet quantified'>",
        "cost_of_inaction": "<what happens if they do nothing>",
        "differentiation": "<why us vs. alternatives>"
      }},

      "competitive_position": {{
        "known_competitors": ["<competitor names>"],
        "our_strengths": ["<our advantages>"],
        "our_vulnerabilities": ["<where we're weak>"],
        "competitive_strategy": "<3-5 sentences on how to win competitively>"
      }},

      "risks": [
        {{"risk": "<description>", "probability": "high|medium|low", "impact": "high|medium|low", "mitigation": "<action to take>"}}
      ],

      "critical_path": {{
        "must_win_battles": ["<key milestones we must achieve>"],
        "next_30_days": ["<specific actions for next 30 days>"],
        "resources_needed": ["<people, content, exec involvement needed>"],
        "key_meetings_to_schedule": ["<meetings that need to happen>"]
      }},

      "winning_theme": "<1 sentence: the core reason we will win this deal>",

      "red_flags": ["<immediate concerns that need attention>"],

      "coaching_for_rep": "<5-8 sentences of specific, actionable coaching for the sales rep>"
    }}

    SCORING RUBRIC:
    - 9-10: Highly qualified, strong champion, clear path to close, we're positioned to win
    - 7-8: Solid opportunity, some gaps but manageable, good competitive position
    - 5-6: Real opportunity but significant work needed, competitive or unclear
    - 3-4: Poorly qualified, major gaps, uphill battle, consider deprioritizing
    - 1-2: Not qualified, no path to win, recommend disqualifying

    Be specific. Use evidence from the data provided. Avoid generic advice.
  expected_output: >
    A valid JSON object matching the structure above. Be direct and actionable.
    Every recommendation should be specific enough to execute immediately.
    Use markdown in string values (- for bullets, **bold** for emphasis).
  agent: deal_strategist

# =============================================================================
# SUPPORT AGENT COACHING TASKS
# =============================================================================

analyze_support_agent_performance:
  description: >
    Analyze the support performance for agent: {agent_name} ({agent_email})

    CASE DATA (Last {days_back} days):
    {cases_data}

    TEAM BENCHMARKS:
    - Average cases per agent: {team_avg_cases}
    - Average resolution time: {team_avg_resolution_time}
    - Team CSAT average: {team_avg_csat}

    Analyze this agent's performance and provide coaching recommendations.

    Your analysis must return a JSON object with this EXACT structure:
    {{
      "summary": {{
        "overall_score": <1-10 score>,
        "cases_analyzed": <number>,
        "period": "<date range>",
        "headline": "<1 sentence performance summary>"
      }},

      "metrics": {{
        "total_cases": <number>,
        "open_cases": <number>,
        "closed_cases": <number>,
        "avg_resolution_days": <number or null if insufficient data>,
        "by_priority": {{
          "high": <count>,
          "medium": <count>,
          "low": <count>
        }},
        "by_status": {{
          "<status>": <count>
        }}
      }},

      "comparison_to_team": {{
        "case_volume": "<above/at/below average with context>",
        "resolution_speed": "<above/at/below average with context>",
        "case_complexity": "<assessment of complexity mix>"
      }},

      "strengths": [
        {{
          "area": "<strength area>",
          "evidence": "<specific examples from cases>",
          "impact": "<why this matters>"
        }}
      ],

      "improvement_areas": [
        {{
          "area": "<area needing improvement>",
          "current_state": "<what's happening now>",
          "target_state": "<what good looks like>",
          "specific_actions": ["<action 1>", "<action 2>"],
          "example_case": "<case number/subject as example>"
        }}
      ],

      "coaching_recommendations": {{
        "priority_focus": "<#1 thing to work on>",
        "quick_wins": ["<immediate improvements>"],
        "skill_development": ["<longer-term growth areas>"],
        "suggested_training": ["<specific training or resources>"]
      }},

      "notable_cases": [
        {{
          "case_number": "<case number>",
          "subject": "<subject>",
          "note": "<what's notable - good or needs attention>"
        }}
      ]
    }}

    SCORING RUBRIC:
    - 9-10: Exceptional performer, role model for team, exceeds all metrics
    - 7-8: Strong performer, consistent quality, minor areas for growth
    - 5-6: Solid performer, meeting expectations, clear improvement opportunities
    - 3-4: Developing, needs focused coaching, specific skills gaps
    - 1-2: Struggling, requires intensive support, performance plan needed

    Be specific and actionable. Use actual case examples. Avoid generic coaching.
  expected_output: >
    A valid JSON object matching the structure above. Be direct and actionable.
    Every recommendation should be specific enough to act on immediately.
    Reference actual cases where possible for evidence.
  agent: support_coach

# =============================================================================
# SC PREP TASKS (Solutions Consultant Discovery & Demo Preparation)
# =============================================================================

prepare_sc_materials:
  description: >
    Prepare comprehensive {prep_type} materials for this opportunity:

    OPPORTUNITY: {opportunity_name}
    ACCOUNT: {account_name}
    AMOUNT: ${amount}
    STAGE: {stage_name}
    CLOSE DATE: {close_date}

    OPPORTUNITY DETAILS:
    {opportunity_details}

    CONTACTS & STAKEHOLDERS:
    {contacts_data}

    MEETING TRANSCRIPTS (Discovery/Previous Calls):
    {meeting_transcripts}

    SUPPORT HISTORY (Technical Context):
    {support_data}

    Based on this information, prepare comprehensive materials for the Solutions Consultant.

    PREP TYPE: {prep_type}
    - "discovery": Focus on discovery synthesis and questions to ask
    - "demo": Focus on demo planning and storytelling flow
    - "competitive": Focus on battle cards and objection handling
    - "full": Comprehensive prep covering all areas

    Return a JSON object with this structure:
    {{
      "discovery_synthesis": {{
        "summary": "<3-5 sentence executive summary of what we know>",
        "key_findings": [
          {{"finding": "<insight>", "source": "<which meeting/data>", "confidence": "high|medium|low"}}
        ],
        "business_drivers": [
          {{"driver": "<business problem or goal>", "impact": "<why it matters>", "evidence": "<quote or data>"}}
        ],
        "technical_requirements": [
          {{"requirement": "<technical need>", "priority": "must-have|nice-to-have|future", "notes": "<context>"}}
        ],
        "decision_criteria": [
          {{"criterion": "<what they'll evaluate>", "weight": "critical|important|minor", "our_position": "<how we stack up>"}}
        ],
        "decision_process": {{
          "timeline": "<expected timeline>",
          "stakeholders_involved": ["<who>"],
          "evaluation_steps": ["<steps>"],
          "budget_status": "<what we know about budget>"
        }},
        "gaps_in_discovery": ["<what we still need to learn>"]
      }},

      "demo_plan": {{
        "recommended_flow": [
          {{"step": 1, "topic": "<section>", "duration": "<minutes>", "objective": "<what to achieve>", "key_message": "<main point>"}}
        ],
        "opening_hook": "<30-second opening that captures attention based on their specific pain>",
        "key_features_to_highlight": [
          {{"feature": "<feature>", "business_value": "<why they care>", "demo_approach": "<how to show it>"}}
        ],
        "use_cases_to_demonstrate": [
          {{"use_case": "<scenario>", "relevance": "<why it matters to them>", "wow_moment": "<what will impress>"}}
        ],
        "stakeholder_specific_value": {{
          "<stakeholder_title>": "<tailored value message>"
        }},
        "features_to_avoid": ["<what NOT to show and why>"],
        "demo_environment_notes": "<any setup or data considerations>"
      }},

      "competitive_intel": {{
        "likely_competitors": [
          {{"competitor": "<name>", "likelihood": "high|medium|low", "evidence": "<why we think they're involved>"}}
        ],
        "our_differentiators": [
          {{"differentiator": "<our advantage>", "vs_competitor": "<who>", "proof_point": "<how to prove it>"}}
        ],
        "competitive_vulnerabilities": [
          {{"vulnerability": "<where we're weak>", "mitigation": "<how to address>"}}
        ],
        "trap_questions": [
          {{"question": "<question to ask prospect>", "purpose": "<why it helps us>", "if_they_say_X": "<what it reveals>"}}
        ],
        "objection_responses": [
          {{
            "objection": "<what they might say>",
            "source": "<why they might say it>",
            "response": "<how to handle>",
            "proof_point": "<evidence to cite>"
          }}
        ],
        "competitive_landmines": ["<topics to avoid raising>"]
      }},

      "preparation_checklist": [
        {{"item": "<prep task>", "priority": "critical|important|optional", "status": "todo"}}
      ],

      "questions_to_ask": [
        {{"question": "<discovery question>", "purpose": "<why to ask>", "timing": "<when to ask>"}}
      ],

      "risks_and_concerns": [
        {{"risk": "<concern>", "severity": "high|medium|low", "mitigation": "<how to address>"}}
      ],

      "coaching_for_sc": "<5-8 sentences of specific advice for this particular opportunity>"
    }}

    Be specific to THIS opportunity. Use actual names, quotes, and context from the data.
    Don't give generic advice - give actionable, tailored recommendations.
  expected_output: >
    A valid JSON object matching the structure above. Be specific and actionable.
    Every recommendation should be tailored to this specific opportunity and customer.
    Use markdown in string values where appropriate.
  agent: sc_prep_specialist
