       - Email sequence performance if available
       - Personalization indicators

    3. Meeting Activity:
       - Meetings booked vs. meetings held
       - Show rate and comparison to benchmarks (target: 80%+)
       - Meeting source (calls vs. emails vs. inbound)

    4. Activity Patterns:
       - Daily/weekly activity consistency
       - Multi-channel coordination
       - Follow-up cadence effectiveness

    Provide detailed analysis of activity patterns with specific metrics and benchmarks.
  expected_output: >
    Detailed analysis of SDR activity patterns including call connect rates,
    email reply rates, meeting booking effectiveness, and activity consistency
    with specific metrics and benchmark comparisons.
  agent: sdr_activity_analyst

analyze_sdr_lead_pipeline:
  description: >
