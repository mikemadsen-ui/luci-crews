# CrewAI Task Definitions
# Edit these to customize what each crew analyzes and outputs

# =============================================================================
# SALES PIPELINE TASKS
# =============================================================================

analyze_pipeline:
  description: >
    Analyze the following sales pipeline data for {user_name}:

    OPPORTUNITIES:
    {opportunities_data}

    PIPELINE SUMMARY:
    - Total Pipeline Value: ${total_amount}
    - Number of Open Opportunities: {opp_count}
    - Average Probability: {avg_probability}%

    Provide a comprehensive analysis including:
    1. Overall pipeline health assessment
    2. Top opportunities by value and their status
    3. Deals at risk (past close date, low probability, stalled)
    4. Opportunities needing immediate attention
    5. Pipeline coverage vs. quota (if available)
  expected_output: >
    A structured analysis with:
    - Executive summary (2-3 sentences)
    - Risk assessment with specific deals flagged
    - Priority action items ranked by impact
    - 30/60/90 day pipeline outlook
  agent: sales_pipeline_analyst

develop_deal_strategies:
  description: >
    Based on the pipeline analysis, develop specific strategies for the top
    opportunities and at-risk deals identified.

    For each key deal, provide:
    1. Recommended next steps
    2. Stakeholder engagement strategy
    3. Potential objection handling
    4. Competitive positioning (if relevant)
    5. Timeline recommendations
  expected_output: >
    Deal-by-deal strategic recommendations that are specific, actionable,
    and include clear next steps with suggested timelines.
  agent: sales_strategist
  context:
    - analyze_pipeline

# =============================================================================
# ACCOUNT HEALTH TASKS
# =============================================================================

assess_account_health:
  description: >
    Analyze the following account data:

    ACCOUNT: {account_name}
    TIER: {account_tier}
    ARR: ${arr}

    RECENT ACTIVITY:
    {activity_data}

    SUPPORT TICKETS:
    {support_data}

    ENGAGEMENT METRICS:
    {engagement_data}

    Assess this account's health and strategic position. Analyze:
    1. Overall health score (1-10)
    2. Churn risk indicators
    3. Expansion opportunities
    4. Key stakeholder engagement levels
    5. Product adoption status
    6. Strategic recommendations

    Return your analysis as JSON with this exact structure:
    {{
      "score": <number from 1-10 where 1=critical risk, 5=stable, 10=thriving>,
      "status": "<healthy|stable|at_risk|critical>",
      "trend": "<improving|stable|declining>",
      "summary": "<3-5 sentence executive summary of account health>",

      "health_indicators": {{
        "engagement": "<strong|moderate|weak>",
        "adoption": "<high|medium|low>",
        "support_health": "<good|concerning|critical>",
        "relationship": "<strong|stable|strained>"
      }},

      "strengths": ["<strength 1>", "<strength 2>", ...],
      "concerns": ["<concern 1>", "<concern 2>", ...],

      "churn_risk": {{
        "level": "<low|medium|high|critical>",
        "factors": ["<risk factor 1>", "<risk factor 2>"],
        "early_warnings": ["<warning sign 1>", "<warning sign 2>"]
      }},

      "expansion_opportunities": [
        {{"opportunity": "<description>", "potential_value": "<estimated ARR impact>", "confidence": "<high|medium|low>"}}
      ],

      "stakeholder_analysis": {{
        "champion_status": "<strong|weakening|none>",
        "executive_engagement": "<active|passive|disengaged>",
        "key_relationships": ["<relationship note>"],
        "gaps": ["<relationship gap>"]
      }},

      "recommended_actions": [
        {{"action": "<what to do>", "priority": "<critical|high|medium|low>", "owner": "<CSM|AE|Exec|Support>", "timeline": "<immediate|this_week|this_month|this_quarter>"}}
      ],

      "talking_points": ["<point for next customer meeting>"],

      "strategic_focus": "<1-2 sentences on the most important thing to focus on for this account>"
    }}

    SCORING RUBRIC:
    - 9-10: Thriving - expanding, strong champion, excellent engagement, low risk
    - 7-8: Healthy - stable relationship, good adoption, minor concerns only
    - 5-6: Stable - meeting expectations, some gaps, manageable risk
    - 3-4: At Risk - declining engagement, support issues, churn signals
    - 1-2: Critical - immediate intervention needed, high churn probability

    IMPORTANT: Return ONLY the JSON object, no other text.
  expected_output: >
    A JSON object containing account health analysis with score, status, trend,
    summary, health_indicators, strengths, concerns, churn_risk, expansion_opportunities,
    stakeholder_analysis, recommended_actions, talking_points, and strategic_focus.
  agent: account_health_analyst

# =============================================================================
# IMPLEMENTATION TASKS
# =============================================================================

analyze_implementation:
  description: >
    Analyze the following implementation project:

    PROJECT: {project_name}
    ACCOUNT: {account_name}
    STATUS: {project_status}

    TIMELINE:
    - Start Date: {start_date}
    - Target Go-Live: {target_go_live}
    - Current Phase: {current_phase}

    PROGRESS:
    - Completion: {completion_pct}%
    - Hours Used: {hours_used} / {hours_budgeted}
    - Budget Used: ${budget_used} / ${budget_total}

    MILESTONES:
    {milestones_data}

    BLOCKERS/RISKS:
    {risks_data}

    CALL ACTIVITY (Customer Engagement):
    {call_activity}

    IMPORTANT - CALENDAR CONNECTION STATUS:
    If the call activity shows "CALENDAR NOT CONNECTED", this means:
    - We CANNOT see upcoming scheduled meetings (data unavailable)
    - Do NOT flag "no upcoming calls" as a customer engagement risk
    - Instead, note that calendar visibility is limited and recommend connecting calendar
    - Only assess engagement based on PAST calls (Avoma data) which IS available
    - The lack of upcoming call data is a data availability issue, not necessarily poor engagement

    MAVENLINK TASKS (Project Work Breakdown):
    {mavenlink_tasks}

    CRITICAL: Pay close attention to task dates and assignees. Flag these as risks:
    - Overdue tasks (past due date but not completed)
    - Tasks without assignees, especially client-facing tasks
    - Tasks without due dates (lack of planning)
    - Bunching of due dates that may indicate unrealistic scheduling

    Provide:
    1. Project health assessment (consider task completion and overdue items)
    2. Risk analysis with mitigation strategies (include task-related risks)
    3. Timeline feasibility (analyze task due dates vs target go-live)
    4. Resource utilization analysis (look at task assignments)
    5. Customer engagement analysis (based on call frequency and upcoming meetings)
    6. Task planning assessment (are tasks properly assigned and scheduled?)
    7. Recommendations for staying on track
  expected_output: >
    You must return a valid JSON object with this exact structure:
    {{
      "status": "<on_track|at_risk|critical>",
      "status_summary": "<2-3 sentence explanation of overall status>",
      "score": <1-10 integer>,

      "executive_summary": "<6-10 sentence comprehensive summary of project health>",

      "risks": [
        {{
          "risk": "<description of the risk>",
          "severity": "<critical|high|medium|low>",
          "likelihood": "<high|medium|low>",
          "mitigation": "<recommended action to address>",
          "category": "<timeline|resource|customer|technical|scope>"
        }}
      ],

      "customer_engagement": {{
        "assessment": "<strong|adequate|weak|concerning>",
        "meeting_frequency": "<description of meeting cadence>",
        "communication_gaps": ["<gap1>", "<gap2>"],
        "sentiment_indicators": ["<positive or negative signals>"],
        "recommendations": ["<recommendation1>", "<recommendation2>"]
      }},

      "task_analysis": {{
        "summary": "<overall assessment of task health>",
        "overdue_count": <number>,
        "unassigned_count": <number>,
        "overdue_tasks": [
          {{"task": "<name>", "due_date": "<date>", "assignee": "<name or null>", "days_overdue": <number>}}
        ],
        "unassigned_tasks": [
          {{"task": "<name>", "due_date": "<date or null>"}}
        ],
        "upcoming_milestones": [
          {{"milestone": "<name>", "due_date": "<date>", "status": "<on_track|at_risk>"}}
        ]
      }},

      "actions": [
        {{
          "action": "<what needs to be done>",
          "owner": "<who should do it - IC, Customer, Manager, etc.>",
          "priority": "<critical|high|medium|low>",
          "due_date": "<suggested date in YYYY-MM-DD format or null>",
          "category": "<customer|internal|task|escalation>"
        }}
      ],

      "timeline_assessment": {{
        "on_track": <true|false>,
        "confidence": "<high|medium|low>",
        "notes": "<explanation of timeline status>",
        "target_date": "<current target go-live date>",
        "revised_date": "<recommended new date if off track, or null>"
      }},

      "escalation": {{
        "needed": <true|false>,
        "reason": "<why escalation is needed, or null>",
        "recommended_to": "<who to escalate to, or null>"
      }},

      "coaching": "<2-4 sentences of personalized coaching for the IC>"
    }}

    SCORING RUBRIC:
    - 9-10: On track, strong customer engagement, no significant risks, clear path to go-live
    - 7-8: Mostly healthy, minor issues being addressed, good momentum
    - 5-6: At risk, notable gaps or concerns, needs attention
    - 3-4: Significant risk, multiple issues, customer frustration or timeline slippage
    - 1-2: Critical, project may fail without immediate intervention

    Include 3-7 risks ranked by severity. Include 3-10 recommended actions.
    For task_analysis, only include tasks that are actually overdue or unassigned.
  agent: implementation_analyst

# =============================================================================
