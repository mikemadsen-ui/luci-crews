# CrewAI Task Definitions
# Edit these to customize what each crew analyzes and outputs

# =============================================================================
# SALES PIPELINE TASKS
# =============================================================================

analyze_pipeline:
  description: >
    Analyze the following sales pipeline data for {user_name}:

    OPPORTUNITIES:
    {opportunities_data}

    PIPELINE SUMMARY:
    - Total Pipeline Value: ${total_amount}
    - Number of Open Opportunities: {opp_count}
    - Average Probability: {avg_probability}%

    Provide a comprehensive analysis including:
    1. Overall pipeline health assessment
    2. Top opportunities by value and their status
    3. Deals at risk (past close date, low probability, stalled)
    4. Opportunities needing immediate attention
    5. Pipeline coverage vs. quota (if available)
  expected_output: >
    A structured analysis with:
    - Executive summary (2-3 sentences)
    - Risk assessment with specific deals flagged
    - Priority action items ranked by impact
    - 30/60/90 day pipeline outlook
  agent: sales_pipeline_analyst

develop_deal_strategies:
  description: >
    Based on the pipeline analysis, develop specific strategies for the top
    opportunities and at-risk deals identified.

    For each key deal, provide:
    1. Recommended next steps
    2. Stakeholder engagement strategy
    3. Potential objection handling
    4. Competitive positioning (if relevant)
    5. Timeline recommendations
  expected_output: >
    Deal-by-deal strategic recommendations that are specific, actionable,
    and include clear next steps with suggested timelines.
  agent: sales_strategist
  context:
    - analyze_pipeline

# =============================================================================
# ACCOUNT HEALTH TASKS
# =============================================================================

assess_account_health:
  description: >
    Analyze the following account data:

    ACCOUNT: {account_name}
    TIER: {account_tier}
    ARR: ${arr}

    RECENT ACTIVITY:
    {activity_data}

    SUPPORT TICKETS:
    {support_data}

    ENGAGEMENT METRICS:
    {engagement_data}

    Assess this account's health and strategic position. Analyze:
    1. Overall health score (1-10)
    2. Churn risk indicators
    3. Expansion opportunities
    4. Key stakeholder engagement levels
    5. Product adoption status
    6. Strategic recommendations

    Return your analysis as JSON with this exact structure:
    {{
      "score": <number from 1-10 where 1=critical risk, 5=stable, 10=thriving>,
      "status": "<healthy|stable|at_risk|critical>",
      "trend": "<improving|stable|declining>",
      "summary": "<3-5 sentence executive summary of account health>",

      "health_indicators": {{
        "engagement": "<strong|moderate|weak>",
        "adoption": "<high|medium|low>",
        "support_health": "<good|concerning|critical>",
        "relationship": "<strong|stable|strained>"
      }},

      "strengths": ["<strength 1>", "<strength 2>", ...],
      "concerns": ["<concern 1>", "<concern 2>", ...],

      "churn_risk": {{
        "level": "<low|medium|high|critical>",
        "factors": ["<risk factor 1>", "<risk factor 2>"],
        "early_warnings": ["<warning sign 1>", "<warning sign 2>"]
      }},

      "expansion_opportunities": [
        {{"opportunity": "<description>", "potential_value": "<estimated ARR impact>", "confidence": "<high|medium|low>"}}
      ],

      "stakeholder_analysis": {{
        "champion_status": "<strong|weakening|none>",
        "executive_engagement": "<active|passive|disengaged>",
        "key_relationships": ["<relationship note>"],
        "gaps": ["<relationship gap>"]
      }},

      "actions": [
        {{
          "action": "<what to do>",
          "priority": "<critical|high|medium|low>",
          "owner": "<CSM|AE|Exec|Support>",
          "due_date": "<YYYY-MM-DD or null>",
          "category": "<call|email|task|meeting|internal>",
          "context": "<why this action matters for this account>"
        }}
      ],

      "talking_points": ["<point for next customer meeting>"],

      "strategic_focus": "<1-2 sentences on the most important thing to focus on for this account>"
    }}

    SCORING RUBRIC:
    - 9-10: Thriving - expanding, strong champion, excellent engagement, low risk
    - 7-8: Healthy - stable relationship, good adoption, minor concerns only
    - 5-6: Stable - meeting expectations, some gaps, manageable risk
    - 3-4: At Risk - declining engagement, support issues, churn signals
    - 1-2: Critical - immediate intervention needed, high churn probability

    IMPORTANT: Return ONLY the JSON object, no other text.
  expected_output: >
    A JSON object containing account health analysis with score, status, trend,
    summary, health_indicators, strengths, concerns, churn_risk, expansion_opportunities,
    stakeholder_analysis, recommended_actions, talking_points, and strategic_focus.
  agent: account_health_analyst

# =============================================================================
# IMPLEMENTATION TASKS
# =============================================================================

analyze_implementation:
  description: >
    Analyze the following implementation project:

    PROJECT: {project_name}
    ACCOUNT: {account_name}
    STATUS: {project_status}

    TIMELINE:
    - Start Date: {start_date}
    - Target Go-Live: {target_go_live}
    - Current Phase: {current_phase}

    PROGRESS:
    - Completion: {completion_pct}%
    - Hours Used: {hours_used} / {hours_budgeted}
    - Budget Used: ${budget_used} / ${budget_total}

    MILESTONES:
    {milestones_data}

    BLOCKERS/RISKS:
    {risks_data}

    CALL ACTIVITY (Customer Engagement):
    {call_activity}

    IMPORTANT - CALENDAR CONNECTION STATUS:
    If the call activity shows "CALENDAR NOT CONNECTED", this means:
    - We CANNOT see upcoming scheduled meetings (data unavailable)
    - Do NOT flag "no upcoming calls" as a customer engagement risk
    - Instead, note that calendar visibility is limited and recommend connecting calendar
    - Only assess engagement based on PAST calls (Avoma data) which IS available
    - The lack of upcoming call data is a data availability issue, not necessarily poor engagement

    MAVENLINK TASKS (Project Work Breakdown):
    {mavenlink_tasks}

    CRITICAL: Pay close attention to task dates and assignees. Flag these as risks:
    - Overdue tasks (past due date but not completed)
    - Tasks without assignees, especially client-facing tasks
    - Tasks without due dates (lack of planning)
    - Bunching of due dates that may indicate unrealistic scheduling

    Provide:
    1. Project health assessment (consider task completion and overdue items)
    2. Risk analysis with mitigation strategies (include task-related risks)
    3. Timeline feasibility (analyze task due dates vs target go-live)
    4. Resource utilization analysis (look at task assignments)
    5. Customer engagement analysis (based on call frequency and upcoming meetings)
    6. Task planning assessment (are tasks properly assigned and scheduled?)
    7. Recommendations for staying on track
  expected_output: >
    You must return a valid JSON object with this exact structure:
    {{
      "status": "<on_track|at_risk|critical>",
      "status_summary": "<2-3 sentence explanation of overall status>",
      "score": <1-10 integer>,

      "executive_summary": "<6-10 sentence comprehensive summary of project health>",

      "risks": [
        {{
          "risk": "<description of the risk>",
          "severity": "<critical|high|medium|low>",
          "likelihood": "<high|medium|low>",
          "mitigation": "<recommended action to address>",
          "category": "<timeline|resource|customer|technical|scope>"
        }}
      ],

      "customer_engagement": {{
        "assessment": "<strong|adequate|weak|concerning>",
        "meeting_frequency": "<description of meeting cadence>",
        "communication_gaps": ["<gap1>", "<gap2>"],
        "sentiment_indicators": ["<positive or negative signals>"],
        "recommendations": ["<recommendation1>", "<recommendation2>"]
      }},

      "task_analysis": {{
        "summary": "<overall assessment of task health>",
        "overdue_count": <number>,
        "unassigned_count": <number>,
        "overdue_tasks": [
          {{"task": "<name>", "due_date": "<date>", "assignee": "<name or null>", "days_overdue": <number>}}
        ],
        "unassigned_tasks": [
          {{"task": "<name>", "due_date": "<date or null>"}}
        ],
        "upcoming_milestones": [
          {{"milestone": "<name>", "due_date": "<date>", "status": "<on_track|at_risk>"}}
        ]
      }},

      "actions": [
        {{
          "action": "<what needs to be done>",
          "priority": "<critical|high|medium|low>",
          "owner": "<IC|Customer|Manager|Support>",
          "due_date": "<YYYY-MM-DD or null>",
          "category": "<call|email|task|meeting|internal>",
          "context": "<why this action is needed for this project>"
        }}
      ],

      "timeline_assessment": {{
        "on_track": <true|false>,
        "confidence": "<high|medium|low>",
        "notes": "<explanation of timeline status>",
        "target_date": "<current target go-live date>",
        "revised_date": "<recommended new date if off track, or null>"
      }},

      "escalation": {{
        "needed": <true|false>,
        "reason": "<why escalation is needed, or null>",
        "recommended_to": "<who to escalate to, or null>"
      }},

      "coaching": "<2-4 sentences of personalized coaching for the IC>"
    }}

    SCORING RUBRIC:
    - 9-10: On track, strong customer engagement, no significant risks, clear path to go-live
    - 7-8: Mostly healthy, minor issues being addressed, good momentum
    - 5-6: At risk, notable gaps or concerns, needs attention
    - 3-4: Significant risk, multiple issues, customer frustration or timeline slippage
    - 1-2: Critical, project may fail without immediate intervention

    Include 3-7 risks ranked by severity. Include 3-10 recommended actions.
    For task_analysis, only include tasks that are actually overdue or unassigned.
  agent: implementation_analyst

# =============================================================================
# CALL AGENDA TASKS
# =============================================================================

generate_call_agenda:
  description: >
    Generate a comprehensive agenda for an upcoming implementation call.

    {context}

    Based on the context above, generate a prioritized agenda with items to discuss.

    CRITICAL RULES:
    1. CARRY-FORWARD ITEMS: All incomplete items from previous calls MUST be included.
       - Items marked [LATE] should have priority "critical"
       - Items marked [RESCHEDULED] should have priority "high"
       - Preserve the original assignee and type

    2. MAVENLINK TASKS: Include relevant tasks as agenda items:
       - Overdue tasks become "critical" priority
       - Tasks due within 7 days become "high" priority
       - Tasks that need status updates become agenda items

    3. PROJECT STATUS: Include items related to:
       - Go-live date discussions if approaching (within 30 days)
       - Milestone status updates
       - Risk items that need discussion

    4. PRIORITY DISTRIBUTION:
       - Limit "critical" items to 2-3 max
       - Balance with "high", "normal", and "low" priorities
       - Put the most important items first
  expected_output: >
    You must return a valid JSON object with this exact structure:
    {{
      "agenda_items": [
        {{
          "title": "<clear, actionable title>",
          "description": "<1-2 sentence context or details>",
          "item_type": "<discussion|action_item|deliverable|followup>",
          "priority": "<critical|high|normal|low>",
          "source_type": "<mavenlink_task|previous_call|manual|extracted_deliverable>",
          "source_id": "<ID if from Mavenlink or previous item, null otherwise>",
          "assigned_to_name": "<person's name or null>",
          "assigned_to_type": "<customer|internal|null>",
          "due_date": "<YYYY-MM-DD or null>",
          "is_late": <true|false>,
          "carry_forward_count": <0 or count from previous>
        }}
      ],
      "suggested_duration_minutes": <30|45|60>,
      "call_objectives": [
        "<objective 1>",
        "<objective 2>"
      ],
      "preparation_notes": "<any special preparation needed for this call>"
    }}

    ORDER items by priority (critical first), then by item_type (action_items before discussions).
    Include 5-15 agenda items, balancing comprehensiveness with realistic call duration.
    For carry-forward items, preserve the original source_id to maintain lineage.
  agent: call_agenda_planner

verify_call_completion:
  description: >
    Analyze the call transcript to verify which agenda items were completed.

    {context}

    AGENDA ITEMS TO VERIFY:
    {agenda_items}

    CALL TRANSCRIPT:
    {transcript}

    For each agenda item, determine:
    1. Was it discussed during the call?
    2. If discussed, was it completed/resolved?
    3. Are there new owners or updated timelines?
    4. Did any new action items emerge from the discussion?

    VERIFICATION CRITERIA:
    - "verified_complete": The item was clearly addressed and resolved, OR a clear
      commitment was made with a deadline
    - "verified_incomplete": The item was discussed but NOT resolved, needs more work
    - "not_discussed": The item was not mentioned in the transcript
    - For action items/deliverables: Look for explicit confirmation of completion

    EXTRACTING NEW ITEMS:
    - Listen for phrases like "we need to...", "can you...", "let's schedule...",
      "action item:", "follow up on..."
    - Identify the owner (customer name vs internal team)
    - Extract any mentioned deadlines
  expected_output: >
    You must return a valid JSON object with this exact structure:
    {{
      "verified_items": [
        {{
          "item_id": "<ID of the agenda item>",
          "item_title": "<title for reference>",
          "verification_status": "<verified_complete|verified_incomplete|not_discussed>",
          "confidence": <0.0-1.0>,
          "evidence": "<quote or summary from transcript supporting the verdict>",
          "notes": "<any additional context>",
          "new_owner": "<if ownership changed, new owner name, else null>",
          "new_due_date": "<if deadline discussed, YYYY-MM-DD, else null>"
        }}
      ],
      "new_action_items": [
        {{
          "title": "<action item title>",
          "description": "<context from call>",
          "item_type": "<action_item|deliverable|followup>",
          "assigned_to_name": "<person name>",
          "assigned_to_type": "<customer|internal>",
          "due_date": "<YYYY-MM-DD if mentioned, else null>",
          "priority": "<high|normal|low>",
          "source_quote": "<relevant quote from transcript>"
        }}
      ],
      "call_summary": "<2-3 sentence summary of what was accomplished>",
      "follow_up_needed": <true|false>,
      "next_call_suggested_topics": [
        "<topic that needs follow-up>"
      ]
    }}

    Be thorough but avoid false positives. If unsure whether something was completed,
    mark as "verified_incomplete" with lower confidence.
  agent: call_verification_analyst

# =============================================================================
# SENTIMENT ANALYSIS TASKS
# =============================================================================

analyze_sentiment:
  description: >
    Analyze customer sentiment for:

    ACCOUNT: {account_name}

    RECENT COMMUNICATIONS:
    {communications_data}

    SUPPORT INTERACTIONS:
    {support_data}

    MEETING NOTES:
    {meeting_notes}

    SCORING RULES — follow these strictly:

    1. RECENCY DOMINATES: The most recent 30 days of interactions should carry ~60% of the score weight.
       Interactions 30-90 days old carry ~30%. Anything older than 90 days carries ~10%.
       A historically great relationship that is NOW deteriorating should score LOW, not average.

    2. CHURN/OFFBOARDING SIGNALS are extremely negative. If recent conversations mention any of:
       offboarding, cancellation, churn, not renewing, winding down, transitioning away, end of contract,
       decommissioning, sunsetting — the score should be 1-3 regardless of historical positivity.

    3. SCORE CALIBRATION:
       - 1-2: Active churn, offboarding, hostile, or completely disengaged
       - 3-4: Serious risk — escalation-level concerns, contract disputes, major dissatisfaction
       - 5: Neutral — no strong signals either way, minimal engagement
       - 6-7: Generally positive but with notable concerns or gaps
       - 8-9: Strong positive — engaged champion, expanding, vocal advocate
       - 10: Exceptional — unsolicited referrals, case study participant, strategic partnership

    4. DO NOT default to 7. A score of 7 requires clear evidence of positive sentiment in RECENT interactions.
       When in doubt, score LOWER. It is far more harmful to miss a risk than to flag a false alarm.

    Analyze the sentiment and return your analysis as JSON with this exact structure:
    {{
      "score": <number from 1-10 following the scoring rules above>,
      "confidence": "<high/medium/low>",
      "trend": "<improving/stable/declining>",
      "summary": "<2-3 sentence executive summary of overall sentiment>",
      "positive_signals": ["<signal 1>", "<signal 2>", ...],
      "warning_signs": ["<warning 1>", "<warning 2>", ...],
      "key_themes": ["<theme 1>", "<theme 2>", ...],
      "key_quotes": [
        {{"quote": "<exact quote>", "context": "<why this matters>"}},
        ...
      ],
      "actions": [
        {{
          "action": "<what to do>",
          "priority": "<critical|high|medium|low>",
          "owner": "<CSM|AE|Support>",
          "due_date": "<YYYY-MM-DD or null>",
          "category": "<call|email|task|meeting|internal>",
          "context": "<why this action addresses sentiment concerns>"
        }}
      ],
      "talking_points": ["<point 1>", "<point 2>", ...]
    }}

    IMPORTANT: Return ONLY the JSON object, no other text.
  expected_output: >
    A JSON object containing sentiment analysis with score, confidence, trend,
    summary, positive_signals, warning_signs, key_themes, key_quotes,
    recommended_actions, and talking_points.
  agent: sentiment_analyst

# =============================================================================
# COMPETITIVE ANALYSIS TASKS
# =============================================================================

analyze_competitive_landscape:
  description: >
    Analyze the competitive situation for:

    OPPORTUNITY: {opportunity_name}
    ACCOUNT: {account_name}
    STAGE: {stage}

    KNOWN COMPETITORS:
    {competitors_data}

    DEAL CONTEXT:
    {deal_context}

    Provide:
    1. Competitive threat assessment
    2. Our strengths vs. each competitor
    3. Our vulnerabilities to address
    4. Recommended positioning strategy
    5. Objection handling for each competitor
  expected_output: >
    A competitive battle plan including:
    - Threat level for each competitor (High/Medium/Low)
    - Key differentiators to emphasize
    - Landmines to avoid
    - Talk tracks for competitive discussions
    - Win themes to reinforce throughout the sales cycle
  agent: competitive_analyst

analyze_companies_competitive:
  description: >
    Analyze the following competitor companies and provide comprehensive
    competitive intelligence:

    ANALYSIS TYPE: {analysis_type}
    NUMBER OF COMPANIES: {num_companies}

    COMPANIES TO ANALYZE:
    {companies_text}

    Provide a detailed competitive analysis. Return a JSON object with this structure:
    {{
      "executive_summary": "<2-3 sentence overview of the competitive landscape>",

      "companies": [
        {{
          "name": "<company name>",
          "domain": "<company domain>",
          "threat_level": "high|medium|low",
          "market_position": "<brief description of market position>",
          "key_strengths": ["<strength 1>", "<strength 2>"],
          "key_weaknesses": ["<weakness 1>", "<weakness 2>"],
          "typical_customers": "<who they typically sell to>",
          "pricing_model": "<what's known about their pricing>",
          "technology_stack": "<relevant tech info if known>"
        }}
      ],

      "our_positioning": {{
        "key_differentiators": ["<how we're different/better>"],
        "vulnerabilities": ["<where we're weak vs. these competitors>"],
        "unique_value_props": ["<our unique advantages>"]
      }},

      "battle_cards": [
        {{
          "competitor": "<company name>",
          "when_you_encounter": "<scenario when you'll face this competitor>",
          "key_message": "<main positioning message>",
          "talk_track": "<what to say in conversations>",
          "objections_to_expect": [
            {{"objection": "<what they'll say>", "response": "<how to respond>"}}
          ],
          "trap_questions": [
            {{"question": "<question to ask prospect>", "why": "<what it reveals>"}}
          ],
          "landmines": ["<topics to avoid>"]
        }}
      ],

      "market_insights": {{
        "market_trends": ["<relevant trends>"],
        "competitive_dynamics": "<how the competitive landscape is evolving>",
        "recommendations": ["<strategic recommendations>"]
      }},

      "win_themes": ["<overarching themes to emphasize in competitive deals>"]
    }}

    Be specific and actionable. If information about a company is limited,
    note what's known and what would be valuable to research further.
  expected_output: >
    A comprehensive JSON analysis including company profiles, battle cards,
    positioning strategy, and actionable competitive intelligence.
  agent: competitive_analyst

# =============================================================================
# PROJECT SENTIMENT TASKS
# =============================================================================

analyze_project_sentiment:
  description: >
    Analyze the following implementation project meeting transcripts:

    PROJECT: {project_name}
    ACCOUNT: {account_name}

    MEETING TRANSCRIPTS:
    {transcripts_data}

    You must analyze and return a JSON object with the following structure:
    {{
      "score": <1-10 overall project sentiment/health>,
      "pm_effectiveness_score": <1-10>,
      "summary": "<6-10 sentences executive summary>",
      "pm_summary": "<10-16 sentences including: (a) PM strengths, (b) PM improvement areas, (c) 6-10 coaching recommendations as directives, (d) 2-4 example phrases PM could use. Use markdown: - for bullets, **bold** for emphasis>",
      "customer_sentiment_summary": "<6-10 sentences about customer tone and engagement>",
      "timeline_deliverables_summary": "<6-12 sentences about timelines and deliverables>",
      "risks_summary": "<6-10 sentences about risks and concerns>",
      "deliverables": [
        {{"deliverable": "", "owner": "", "due_date": "", "status": "committed|tentative|unclear", "evidence": "<quote>", "call": "<meeting_subject>", "call_date": ""}}
      ],
      "timeline_dates": [
        {{"date": "", "context": "", "call": "", "call_date": ""}}
      ],
      "participants_sentiment": {{
        "customer": ["collaborative", "anxious"],
        "pm": ["clear", "directive"],
        "notes": "<2-4 coaching notes about interaction dynamics>"
      }},
      "key_quotes": [
        {{"speaker": "", "quote": "", "sentiment": "positive|negative|neutral", "call": "", "call_date": ""}}
      ],
      "actions": [
        {{
          "action": "<recommended action based on sentiment analysis>",
          "priority": "<critical|high|medium|low>",
          "owner": "<IC|Manager|Customer>",
          "due_date": "<YYYY-MM-DD or null>",
          "category": "<call|email|task|meeting|internal>",
          "context": "<why this action addresses sentiment/risk observed>"
        }}
      ]
    }}

    KEY QUOTES INSTRUCTIONS:
    Select 3-6 quotes that DIRECTLY express sentiment about the project, relationship, or experience.
    Each quote MUST clearly convey emotion or opinion - NOT factual statements or questions.

    GOOD examples (include these types):
    - "We're really excited about this rollout" (positive)
    - "I'm frustrated we keep pushing this back" (negative)
    - "The team has been great to work with" (positive)
    - "I'm concerned about hitting the deadline" (negative)
    - "This is exactly what we needed" (positive)

    BAD examples (do NOT include these types):
    - "Let's schedule a follow-up for next week" (neutral/logistical)
    - "Can you send me the documentation?" (question, not sentiment)
    - "The integration uses REST APIs" (factual, no sentiment)

    SCORING RUBRIC:
    - 9-10: Clear plan, owners, dates; customer aligned/positive; risks managed
    - 7-8: Mostly strong; minor gaps but good momentum
    - 5-6: Mixed; recurring ambiguity, weak follow-up, customer hesitation
    - 3-4: Significant risk; unclear ownership; customer frustration
    - 1-2: Derailing; high conflict; no credible plan

    Apply RECENCY WEIGHTING: most recent calls (last 30 days) are PRIMARY indicators.
  expected_output: >
    A valid JSON object matching the structure above. The JSON must be parseable.
    Use markdown formatting in string values (- for bullets, **bold** for emphasis).
    All arrays should have at least one item if data exists.
  agent: implementation_coach

# =============================================================================
# OPPORTUNITY STRATEGY TASKS (McKinsey-style Deal Analysis)
# =============================================================================

analyze_opportunity_strategy:
  description: >
    Perform a comprehensive McKinsey-style analysis of this enterprise opportunity:

    OPPORTUNITY: {opportunity_name}
    ACCOUNT: {account_name}
    AMOUNT: ${amount}
    STAGE: {stage_name}
    PROBABILITY: {probability}%
    CLOSE DATE: {close_date}
    OWNER: {owner_name}

    OPPORTUNITY DETAILS:
    {opportunity_details}

    ACCOUNT CONTEXT:
    {account_context}

    RECENT MEETING NOTES/TRANSCRIPTS:
    {meeting_data}

    SUPPORT CASES (if any):
    {support_data}

    Analyze this opportunity as if you were a McKinsey consultant advising on a
    multi-million dollar deal. Be rigorous, evidence-based, and brutally honest.

    CRITICAL: Distinguish between CUSTOMER stakeholders and LeanData INTERNAL employees:
    - LeanData employees (AEs, CSMs, SEs, PMs) are OUR team, NOT customer stakeholders
    - Names with @leandata.com emails or LeanData titles are INTERNAL
    - Only list CUSTOMER contacts as stakeholders (economic buyer, champion, blockers, influencers)
    - If you see a LeanData employee in transcripts, they are the internal team working the deal
    - Common LeanData roles: Account Executive, CSM, Customer Success Manager, Solutions Engineer,
      Implementation Manager, Support Engineer, Sales Rep

    Return a JSON object with the following structure:
    {{
      "score": <1-10 overall deal health/win probability>,
      "win_probability_assessment": "<frank assessment: Likely Win | Competitive | Uphill Battle | Long Shot>",
      "executive_summary": "<4-6 sentences: the bottom line on this deal>",

      "qualification": {{
        "score": <1-10>,
        "has_budget": <true|false|"unclear">,
        "has_authority": <true|false|"unclear">,
        "has_need": <true|false|"unclear">,
        "has_timeline": <true|false|"unclear">,
        "champion_strength": "<strong|moderate|weak|none>",
        "decision_process_clarity": "<clear|partially clear|unclear>",
        "assessment": "<3-5 sentences on qualification status>"
      }},

      "stakeholders": {{
        "economic_buyer": "<name/role or 'Unknown'>",
        "champion": "<name/role or 'None identified'>",
        "blockers": ["<name/role if any>"],
        "key_influencers": ["<name/role>"],
        "power_map_summary": "<4-6 sentences on org dynamics and politics>",
        "relationship_gaps": ["<gaps to address>"]
      }},

      "value_proposition": {{
        "quantified_pain": "<what problem, quantified if possible>",
        "proposed_value": "<our value proposition>",
        "roi_potential": "<estimated ROI or 'Not yet quantified'>",
        "cost_of_inaction": "<what happens if they do nothing>",
        "differentiation": "<why us vs. alternatives>"
      }},

      "competitive_position": {{
        "known_competitors": ["<competitor names>"],
        "our_strengths": ["<our advantages>"],
        "our_vulnerabilities": ["<where we're weak>"],
